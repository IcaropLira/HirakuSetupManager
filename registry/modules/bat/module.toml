schema = 1
id = "bat"
name = "bat"
description = "Substituto do cat com realce de sintaxe"
platforms = ["linux", "macos", "windows"]
homepage = "https://github.com/sharkdp/bat"
discover = ["shell", "nvim"]

[[install]]
when = { os = "linux", arch = "x86_64" }
provides = ["bat"]
method = "release"
version = "0.26.1"
url = "https://github.com/sharkdp/bat/releases/download/v{version}/bat-v{version}-x86_64-unknown-linux-musl.tar.gz"
sha256 = "0dcd8ac79732c0d5b136f11f4ee00e581440e16a44eab5b3105b611bbf2cf191"
dest = "~/.local/share/hiraku/bat"
strip_components = 1
bins = [{ src = "bat", link = "~/.local/bin/bat" }]
bump = { github = "sharkdp/bat" }

[[install]]
when = { os = "linux", arch = "aarch64" }
provides = ["bat"]
method = "release"
version = "0.26.1"
url = "https://github.com/sharkdp/bat/releases/download/v{version}/bat-v{version}-aarch64-unknown-linux-musl.tar.gz"
sha256 = "6369242c584065f195fb20cb36fbd7cb63ae690605bbe89868a7596b596c2c23"
dest = "~/.local/share/hiraku/bat"
strip_components = 1
bins = [{ src = "bat", link = "~/.local/bin/bat" }]
bump = { github = "sharkdp/bat" }

[[install]]
when = { os = "macos" }
method = "pkg"
names = { brew = "bat" }
provides = ["bat"]

[[install]]
when = { os = "windows" }
method = "pkg"
names = { scoop = "bat" }
