schema = 1
id = "zoxide"
name = "zoxide"
description = "cd mais esperto (aprende suas pastas)"
platforms = ["linux", "macos", "windows"]
homepage = "https://github.com/ajeetdsouza/zoxide"
discover = ["shell"]

[[install]]
when = { os = "linux", arch = "x86_64" }
provides = ["zoxide"]
method = "release"
version = "0.10.0"
url = "https://github.com/ajeetdsouza/zoxide/releases/download/v{version}/zoxide-{version}-x86_64-unknown-linux-musl.tar.gz"
sha256 = "2d93385b99f3e82cf2701609a1bffcad863fbeb75aa3fe7eb6be4d29be68b1ae"
dest = "~/.local/share/hiraku/zoxide"
bins = [{ src = "zoxide", link = "~/.local/bin/zoxide" }]
bump = { github = "ajeetdsouza/zoxide" }

[[install]]
when = { os = "linux", arch = "aarch64" }
provides = ["zoxide"]
method = "release"
version = "0.10.0"
url = "https://github.com/ajeetdsouza/zoxide/releases/download/v{version}/zoxide-{version}-aarch64-unknown-linux-musl.tar.gz"
sha256 = "f1f16c5d6298d63dee467eedea1cdcd8490e43e493bea43acd416dc9033ef641"
dest = "~/.local/share/hiraku/zoxide"
bins = [{ src = "zoxide", link = "~/.local/bin/zoxide" }]
bump = { github = "ajeetdsouza/zoxide" }

[[install]]
when = { os = "macos" }
method = "pkg"
names = { brew = "zoxide" }
provides = ["zoxide"]

[[install]]
when = { os = "windows" }
method = "pkg"
names = { scoop = "zoxide" }
