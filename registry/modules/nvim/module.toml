# ---------------------------------------------------------------- estilos
# Gerados por scripts/gen-editor-options.py: um clique no app troca estas opções.

[[preset]]
id = "bruto"
name = "Bruto"
tag = "de fábrica"
description = "O Neovim sem nada: sem tema, sem destaque de sintaxe, sem atalhos nem plugins. Para treinar do jeito que vem na máquina da prova."
includes = ["Neovim puro, como vem instalado", "Nenhum plugin, abre na hora", "Suas configurações continuam guardadas para voltar"]
[preset.options]
perfil = "bruto"

[[preset]]
id = "dalton"
name = "Dalton"
tag = "só destaque de sintaxe"
description = "Cores no código e nada mais: tema, destaque de sintaxe, número das linhas e as opções básicas do app."
includes = ["Destaque de sintaxe e tema", "Treesitter (sintaxe mais precisa)", "Número das linhas, busca e indentação do app", "Sem atalhos de compilar, sem autocomplete"]
[preset.options]
perfil = "dalton"
relativenumber = "false"
header = "false"

[[preset]]
id = "competicao"
name = "Competição"
tag = "maratona e contest"
description = "O kit de maratona: template pronto ao criar o arquivo e F5–F8 para compilar, executar e testar com o input.txt. Sem autocomplete, como na prova."
includes = ["Template ao criar .cpp, .java e .py", "F5 compila · F6 executa · F7 compila e executa · F8 testa com input.txt", "Fecha-pares e folha de atalhos (F12)", "Sem autocomplete, sem árvore de arquivos"]
[preset.options]
perfil = "competicao"
relativenumber = "false"
header = "false"
autopairs = "true"
inlay = "false"
matchparen = "true"

[[preset]]
id = "competicao-ac"
