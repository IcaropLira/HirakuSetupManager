schema = 1
id = "jdk"
name = "JDK 21 (Temurin)"
description = "JDK para Java no vim/nvim (jdtls, javac)"
platforms = ["linux", "macos"]

# Linux: Temurin 21 portátil em ~/.local, com ou sem root (o default-jdk de distros como o Mint é 11, velho para o jdtls).
# `bump` fixa o arquivo versionado para onde a API da Adoptium redireciona.
[[install]]
when = { os = "linux", arch = "x86_64" }
method = "release"
version = "OpenJDK21U-jdk_x64_linux_hotspot_21.0.13_9.tar.gz"
url = "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13%2B9/OpenJDK21U-jdk_x64_linux_hotspot_21.0.13_9.tar.gz"
sha256 = "d7f5d5cf865a2902b70ff549b97586a7d3f234e016f041ab447ea740c7d66d1c"
dest = "~/.local/share/hiraku/jdk"
strip_components = 1
bins = [{ src = "bin/java", link = "~/.local/bin/java" }, { src = "bin/javac", link = "~/.local/bin/javac" }]
bump = { redirect = "https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jdk/hotspot/normal/eclipse" }

[[install]]
when = { os = "linux", arch = "aarch64" }
method = "release"
version = "OpenJDK21U-jdk_aarch64_linux_hotspot_21.0.13_9.tar.gz"
url = "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13%2B9/OpenJDK21U-jdk_aarch64_linux_hotspot_21.0.13_9.tar.gz"
sha256 = "e3522e707fc7dbe2a72c30746b1e7068301a0213ecd213d4491f35a14eb55578"
dest = "~/.local/share/hiraku/jdk"
strip_components = 1
bins = [{ src = "bin/java", link = "~/.local/bin/java" }, { src = "bin/javac", link = "~/.local/bin/javac" }]
bump = { redirect = "https://api.adoptium.net/v3/binary/latest/21/ga/linux/aarch64/jdk/hotspot/normal/eclipse" }

[[install]]
when = { os = "macos" }
method = "pkg"
names = { brew = "temurin" }
cask = true
