schema = 1
id = "jdk"
name = "JDK 21 (Temurin)"
description = "JDK para Java no vim/nvim (jdtls, javac)"
platforms = ["linux", "macos"]

# Linux: Temurin 21 portátil em ~/.local, com ou sem root (o default-jdk de distros como o Mint é 11, velho para o jdtls).
# `bump` fixa o arquivo versionado para onde a API da Adoptium redireciona.
[[install]]
when = { os = "linux", arch = "x86_64" }
method = "release"
version = "OpenJDK21U-jdk_x64_linux_hotspot_21.0.13.1_2.tar.gz"
url = "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13.1%2B2/OpenJDK21U-jdk_x64_linux_hotspot_21.0.13.1_2.tar.gz"
sha256 = "bb8a93f9ae6e7a693b2b721e85dbeff26ae1a77447985a8d7afcdd9c7cf6222e"
dest = "~/.local/share/hiraku/jdk"
strip_components = 1
bins = [{ src = "bin/java", link = "~/.local/bin/java" }, { src = "bin/javac", link = "~/.local/bin/javac" }]
bump = { redirect = "https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jdk/hotspot/normal/eclipse" }

[[install]]
when = { os = "linux", arch = "aarch64" }
method = "release"
version = "OpenJDK21U-jdk_aarch64_linux_hotspot_21.0.13.1_2.tar.gz"
url = "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13.1%2B2/OpenJDK21U-jdk_aarch64_linux_hotspot_21.0.13.1_2.tar.gz"
sha256 = "8c72816a6b308842d5ed1f13e5826b69c567da4784f7238d7e800efa71fe54b1"
dest = "~/.local/share/hiraku/jdk"
strip_components = 1
bins = [{ src = "bin/java", link = "~/.local/bin/java" }, { src = "bin/javac", link = "~/.local/bin/javac" }]
bump = { redirect = "https://api.adoptium.net/v3/binary/latest/21/ga/linux/aarch64/jdk/hotspot/normal/eclipse" }

[[install]]
when = { os = "macos" }
method = "pkg"
names = { brew = "temurin" }
cask = true
