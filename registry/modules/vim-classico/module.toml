[options.versao.details]
"39bf06d436aa86ec76d2a70f4d547609c756a459" = "A versão mais completa do Vim puro: temas com nome, airline, NERDTree com ícones, coc (C++, Java, Python), F5–F8 para compilar/executar/testar, terminal que fecha no Enter, folha de atalhos no F12, modo silencioso e header."
"d37cb96d22721140360ce93f67d6d791394fe808" = "Teclas de função funcionando em mais terminais (códigos alternativos de F1–F12) e cores do terminal ajustadas."
"3487c5b245f811c9bf78aacded4fdecba6267cf1" = "A release que juntou Vim, tmux e terminal (kitty, starship) no mesmo repositório; comando catcode no terminal. Aqui só o Vim é instalado."
"e67760bd60da80a23724fa223452394e87486826" = "Autocomplete de Python (coc-pyright), F5–F8 também em Python e terminal com rolagem."
"5eec9ae1dd7f06be30601682d9af33bb312b2b87" = "Statusline estilo powerline e a leva de temas novos (burgundy, espresso, hotdog...)."
"001024a8db1eef65ef2d5f0db14d09f0d4286b4e" = "Os temas com nome de gente e de piada interna, terminal embutido e o primeiro pop-up de atalhos."
"e13ab880c4f276507ce6e8bea347544369ff0006" = "Entra o coc.nvim com autocomplete de Java e C++, templates de Java e o tema icaro preto e vermelho."
"91b2f765b62e1ce78b7ac732f758ca3f7955de1a" = "O começo: C++ com template, compilar e executar, explorer e busca. Sem plugins de autocomplete."
