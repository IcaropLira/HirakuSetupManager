schema = 1
id = "node"
name = "Node.js (LTS)"
description = "Runtime exigido pelo coc.nvim e por servidores de linguagem do nvim"
platforms = ["linux", "macos", "windows"]

# Linux: sempre o build oficial LTS em ~/.local, com ou sem root. O Node das distros (ex.: Ubuntu/Mint) costuma ser
# velho demais para o coc.nvim, e ~/.local/bin vem primeiro no PATH (bloco do módulo `shell`).
[[install]]
when = { os = "linux", arch = "x86_64" }
method = "release"
version = "24.22.3"
url = "https://nodejs.org/dist/v{version}/node-v{version}-linux-x64.tar.xz"
sha256 = "4f2b175a6d53a5c617a80dba2676238a0688cef28c6da4eba35c7d844e66fcfb"
dest = "~/.local/share/hiraku/node"
strip_components = 1
bins = [{ src = "bin/node", link = "~/.local/bin/node" }, { src = "bin/npm", link = "~/.local/bin/npm" }, { src = "bin/npx", link = "~/.local/bin/npx" }]
# Linha LTS fixada (24 = Krypton): o bump acompanha 24.x; trocar de major é decisão manual.
bump = { index_url = "https://nodejs.org/dist/latest-v24.x/", index_prefix = "node-v", index_suffix = "-linux-x64.tar.xz" }

[[install]]
when = { os = "linux", arch = "aarch64" }
method = "release"
version = "24.22.3"
url = "https://nodejs.org/dist/v{version}/node-v{version}-linux-arm64.tar.xz"
sha256 = "6e51a2ada00f0011cc266f65d98922b403d7ad88f809ca2aa615a5fe1ce6e86c"
dest = "~/.local/share/hiraku/node"
strip_components = 1
bins = [{ src = "bin/node", link = "~/.local/bin/node" }, { src = "bin/npm", link = "~/.local/bin/npm" }, { src = "bin/npx", link = "~/.local/bin/npx" }]
bump = { index_url = "https://nodejs.org/dist/latest-v24.x/", index_prefix = "node-v", index_suffix = "-linux-arm64.tar.xz" }

[[install]]
when = { os = "macos" }
method = "pkg"
names = { brew = "node" }
provides = ["node"]

[[install]]
when = { os = "windows" }
method = "pkg"
names = { scoop = "nodejs-lts" }
