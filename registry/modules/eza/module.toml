schema = 1
id = "eza"
name = "eza"
description = "Substituto moderno do ls (com ícones)"
platforms = ["linux", "macos", "windows"]
homepage = "https://github.com/eza-community/eza"
discover = ["shell"]

[[install]]
when = { os = "linux", arch = "x86_64" }
provides = ["eza"]
method = "release"
version = "0.23.5"
url = "https://github.com/eza-community/eza/releases/download/v{version}/eza_x86_64-unknown-linux-musl.tar.gz"
sha256 = "e06eebab74b73d6b7d51a796a353824b001bea82df077706382e100815d28904"
dest = "~/.local/share/hiraku/eza"
bins = [{ src = "eza", link = "~/.local/bin/eza" }]
bump = { github = "eza-community/eza" }

[[install]]
when = { os = "linux", arch = "aarch64" }
provides = ["eza"]
method = "release"
version = "0.23.5"
url = "https://github.com/eza-community/eza/releases/download/v{version}/eza_aarch64-unknown-linux-gnu.tar.gz"
sha256 = "40b87ae8628aa2ff0f0d2dc24ab52f689631366385c3da630bae745671fd71ec"
dest = "~/.local/share/hiraku/eza"
bins = [{ src = "eza", link = "~/.local/bin/eza" }]
bump = { github = "eza-community/eza" }

[[install]]
when = { os = "macos" }
method = "pkg"
names = { brew = "eza" }
provides = ["eza"]

[[install]]
when = { os = "windows" }
method = "pkg"
names = { scoop = "eza" }
