schema = 1
id = "lazygit"
name = "lazygit"
description = "Git em tela cheia: stage, commit, branch e rebase com o teclado"
platforms = ["linux", "macos", "windows"]
homepage = "https://github.com/jesseduffield/lazygit"
discover = ["shell", "nvim", "tmux"]

[[install]]
when = { os = "linux", arch = "x86_64" }
provides = ["lazygit"]
method = "release"
version = "0.66.3"
url = "https://github.com/jesseduffield/lazygit/releases/download/v{version}/lazygit_{version}_linux_x86_64.tar.gz"
sha256 = "0a23f429a95f0d09db298b3c291536d818de066aa5a85c255806f0490ff6656b"
dest = "~/.local/share/hiraku/lazygit"
bins = [{ src = "lazygit", link = "~/.local/bin/lazygit" }]
bump = { github = "jesseduffield/lazygit" }

[[install]]
when = { os = "linux", arch = "aarch64" }
provides = ["lazygit"]
method = "release"
version = "0.66.3"
url = "https://github.com/jesseduffield/lazygit/releases/download/v{version}/lazygit_{version}_linux_arm64.tar.gz"
sha256 = "ac0b48237f3d0283813e7154ec063237e519532feb0470c0881a1793ee78fd42"
dest = "~/.local/share/hiraku/lazygit"
bins = [{ src = "lazygit", link = "~/.local/bin/lazygit" }]
bump = { github = "jesseduffield/lazygit" }

[[install]]
when = { os = "macos" }
method = "pkg"
names = { brew = "lazygit" }
provides = ["lazygit"]

[[install]]
when = { os = "windows" }
method = "pkg"
names = { scoop = "lazygit" }
