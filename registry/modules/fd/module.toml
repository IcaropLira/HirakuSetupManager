schema = 1
id = "fd"
name = "fd"
description = "find mais simples e rápido (fd nome, fd -e pdf)"
platforms = ["linux", "macos", "windows"]
homepage = "https://github.com/sharkdp/fd"
discover = ["shell", "nvim"]

[[install]]
when = { os = "linux", arch = "x86_64" }
provides = ["fd"]
method = "release"
version = "10.5.2"
url = "https://github.com/sharkdp/fd/releases/download/v{version}/fd-v{version}-x86_64-unknown-linux-musl.tar.gz"
sha256 = "7e2d07fa2b8807642aaec67b7e2972a9fbe4db26fcb340a7372392db42b26694"
dest = "~/.local/share/hiraku/fd"
strip_components = 1
bins = [{ src = "fd", link = "~/.local/bin/fd" }]
bump = { github = "sharkdp/fd" }

[[install]]
when = { os = "linux", arch = "aarch64" }
provides = ["fd"]
method = "release"
version = "10.5.2"
url = "https://github.com/sharkdp/fd/releases/download/v{version}/fd-v{version}-aarch64-unknown-linux-musl.tar.gz"
sha256 = "63ea52cb31586e6d98efa2f06d73d542f16c7d0c4af0f07b579aaf9714cf907a"
dest = "~/.local/share/hiraku/fd"
strip_components = 1
bins = [{ src = "fd", link = "~/.local/bin/fd" }]
bump = { github = "sharkdp/fd" }

[[install]]
when = { os = "macos" }
method = "pkg"
names = { brew = "fd" }
provides = ["fd"]

[[install]]
when = { os = "windows" }
method = "pkg"
names = { scoop = "fd" }
