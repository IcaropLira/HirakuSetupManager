"alan_turing_antiresenha" = "Alan Turing"
"henrique" = "Henrique"
"off_light" = "Of(f) Light"
"geraldo" = "Geraldo"
"cabeludo" = "Cabeludo"
"cookie" = "Cookie"
"ruiva" = "Ruiva"
"baiana" = "Baiana"
"do_mal" = "Do Mal"
"sofia" = "Paz"
"guerra" = "Guerra"
"soares" = "Soares"
"biscoitinho" = "Biscoitinho"
