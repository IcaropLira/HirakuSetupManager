schema = 1
id = "vim"
name = "Vim"
description = "Vim com tema, plugins (airline, nerdtree, fugitive, coc...) e wrapper que restaura o terminal"
platforms = ["linux", "macos"]
requires = ["icaro-themes", "font-jetbrains-mono"]

# O Vim em si só é instalado com root (o seu install.sh também exigia um Vim já instalado).
# Sem root, o módulo ainda configura e instala os plugins sobre o Vim que existir na máquina.
[[install]]
when = { os = "linux", root = true }
method = "pkg"
names = { dnf = "vim-enhanced", apt = "vim", pacman = "vim", zypper = "vim" }
provides = ["vim"]

[[install]]
when = { os = "macos" }
method = "pkg"
names = { brew = "vim" }
provides = ["vim"]

[[install]]
group = "plugin-vim-airline"
optional = true
method = "git"
url = "https://github.com/vim-airline/vim-airline"
rev = "8dc1bd0a116de527f6bc58c1d04386ba357c624f"
dest = "~/.vim/pack/plugins/opt/vim-airline"
bump = {}

[[install]]
group = "plugin-vim-airline-themes"
optional = true
method = "git"
url = "https://github.com/vim-airline/vim-airline-themes"
rev = "77aab8c6cf7179ddb8a05741da7e358a86b2c3ab"
dest = "~/.vim/pack/plugins/opt/vim-airline-themes"
bump = {}

[[install]]
group = "plugin-nerdtree"
optional = true
method = "git"
url = "https://github.com/preservim/nerdtree"
rev = "690d061b591525890f1471c6675bcb5bdc8cdff9"
dest = "~/.vim/pack/plugins/opt/nerdtree"
bump = {}

[[install]]
group = "plugin-nerdtree-git-plugin"
optional = true
method = "git"
url = "https://github.com/Xuyuanp/nerdtree-git-plugin"
rev = "e1fe727127a813095854a5b063c15e955a77eafb"
dest = "~/.vim/pack/plugins/opt/nerdtree-git-plugin"
bump = {}

[[install]]
group = "plugin-vim-fugitive"
optional = true
method = "git"
url = "https://github.com/tpope/vim-fugitive"
rev = "3b753cf8c6a4dcde6edee8827d464ba9b8c4a6f0"
dest = "~/.vim/pack/plugins/opt/vim-fugitive"
bump = {}

[[install]]
group = "plugin-vim-devicons"
optional = true
method = "git"
url = "https://github.com/ryanoasis/vim-devicons"
rev = "71f239af28b7214eebb60d4ea5bd040291fb7e33"
dest = "~/.vim/pack/plugins/opt/vim-devicons"
bump = {}

[[install]]
group = "plugin-coc-nvim"
optional = true
method = "git"
url = "https://github.com/neoclide/coc.nvim"
rev = "25e88c8e94a44b886c5a66f49fb98a6eb040b4fa"
dest = "~/.vim/pack/plugins/opt/coc.nvim"
bump = { branch = "release" }

[[config]]
src = "files/vimrc"
dest = { unix = "~/.vimrc" }

[[config]]
src = "files/config"
dest = { unix = "~/.vim/config" }

[[config]]
src = "files/templates"
dest = { unix = "~/.vim/templates" }

# Estado/preferência do usuário: criado uma vez, nunca sobrescrito.
[[config]]
src = "files/seed/local.vim"
dest = { unix = "~/.vim/config/local.vim" }
mode = "seed"

[[config]]
src = "files/seed/coc-settings.json"
dest = { unix = "~/.vim/coc-settings.json" }
mode = "seed"


# Opções escolhidas no app (ou com `hiraku set vim ...`). O editor lê este arquivo ao
# abrir e reaplica sozinho quando ele muda.
[[config]]
src = "files/hiraku.json"
dest = { unix = "~/.vim/hiraku.json" }
template = true
# O editor recarrega sozinho; mudar opção não roda o bootstrap/Lazy sync.
triggers_hooks = false

[[hook]]
name = "wrapper"
when = { os = "linux" }
script = "hooks/wrapper.sh"
optional = true

[[hook]]
name = "coc-extensions"
script = "hooks/coc-extensions.sh"
on = "once"
needs = ["node"]
optional = true

# ---------------------------------------------------------------- opções
# Geradas por scripts/gen-editor-options.py; o app mostra na ordem abaixo,
# agrupadas por seção. Vão para files/hiraku.json, que o editor lê e reaplica ao vivo.

[options.colorscheme]
type = "choice"
default = "auto"
values = ["auto", "maria_isabel", "jales", "camelo", "sassa", "malvadao", "mateus_sao_paulino", "pedro_de", "belchior", "lucas_ribeiro", "alan_turing", "alan_turing_antiresenha", "henrique", "off_light", "geraldo", "cabeludo", "cookie", "ruiva", "baiana", "do_mal", "sofia", "guerra", "soares", "biscoitinho", "gvsl", "jf", "toyman", "massoni", "dijkstra", "ever_dream_this_man", "raul", "acesso_negado", "espresso", "plum", "flatui", "neocybervim", "sunbather", "tatami", "lucid", "lucario", "roti", "hotdog", "macvim_light", "farout", "burgundy", "petra"]
label = "Tema"
section = "Aparência"
description = "Colorscheme do editor. \"O último escolhido no editor\" deixa a troca com F3/:Th."
preview = "../icaro-themes/files/icaro-theme/colors/{value}.vim"
