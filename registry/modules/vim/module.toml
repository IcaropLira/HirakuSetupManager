description = "Abrir o Vim sem arquivo mostra os recentes e as sessões salvas. Baixa na hora, com o Vim aberto."
link = "https://github.com/mhinz/vim-startify"

[options.plugin_goyo]
type = "bool"
default = false
label = "Modo foco (goyo)"
section = "Descobrir"
description = "<leader>z centraliza o texto e esconde o resto da interface. Baixa na hora, com o Vim aberto."
link = "https://github.com/junegunn/goyo.vim"

[options.plugin_indentline]
type = "bool"
default = false
label = "Guias de indentação (indentLine)"
section = "Descobrir"
description = "Uma linha fininha marca cada nível de indentação. Baixa na hora, com o Vim aberto."
link = "https://github.com/Yggdroot/indentLine"

[options.extra]
type = "lines"
default = ""
label = "Configuração extra"
section = "Avançado"
description = "Vimscript executado por último, a cada vez que as opções são aplicadas. Para o que não tem botão aqui."
