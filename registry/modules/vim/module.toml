[options.template_cpp]
type = "lines"
default = "#include \"bits/stdc++.h\"\nusing namespace std;\n//#pragma once\n//#pragma GCC optimize(\"O3,unroll-loops\")\n//#pragma GCC target(\"avx2,bmi,bmi2,lzcnt,popcnt\")\n\n#define endl '\\n'\n#define rep(i, a, b) for (int i = a; i < (b); i++)\n#define all(x) (x).begin(), (x).end()\n#define sz(x) (int)(x).size()\n#define sq(x) (x)*(x)\ntemplate<class T, class U> inline void chmin(T& a, U b) { if (a > b) a = b; }\ntemplate<class T, class U> inline void chmax(T& a, U b) { if (a < b) a = b; }\nmt19937 rng((int) chrono::steady_clock::now().time_since_epoch().count());\ntypedef long long ll;\ntypedef long double ld;\ntypedef __int128 i128;\n\nvoid solve_tc() {\n}\n\nint main() {\n    cin.tie(0)->sync_with_stdio(0);\n    int tc = 1;\n    cin >> tc;\n    while (tc--) solve_tc();\n}\n\n"
label = "C++"
section = "Templates"
description = "Texto de todo arquivo .cpp novo. __CURSOR__ marca onde o cursor começa. Vazio = arquivo em branco."

[options.template_c]
type = "lines"
default = ""
label = "C"
section = "Templates"
description = "Texto de todo arquivo .c novo. __CURSOR__ marca onde o cursor começa. Vazio = arquivo em branco."

[options.template_python]
type = "lines"
default = ""
label = "Python"
section = "Templates"
description = "Texto de todo arquivo .py novo. __CURSOR__ marca onde o cursor começa. Vazio = arquivo em branco."

[options.template_java_cp]
type = "lines"
default = "import java.io.*;\nimport java.util.*;\n\nclass Main {\n\n    static BufferedReader br;\n    static StringTokenizer st;\n    static PrintWriter out;\n\n    public static void main(String[] args) throws IOException {\n        br = new BufferedReader(new InputStreamReader(System.in));\n        out = new PrintWriter(new BufferedWriter(new OutputStreamWriter(System.out)));\n\n        int t = 1;\n        t = nextInt();\n\n        while (t-- > 0) {\n            solve();\n        }\n\n        out.flush();\n    }\n\n    static void solve() throws IOException {\n\n    }\n\n    static String next() throws IOException {\n        while (st == null || !st.hasMoreTokens()) {\n            st = new StringTokenizer(br.readLine());\n        }\n        return st.nextToken();\n    }\n\n    static int nextInt() throws IOException {\n        return Integer.parseInt(next());\n    }\n\n    static long nextLong() throws IOException {\n        return Long.parseLong(next());\n    }\n\n    static double nextDouble() throws IOException {\n        return Double.parseDouble(next());\n    }\n}\n"
label = "Java (programação competitiva)"
section = "Templates"
description = "Texto de todo arquivo .java terminado em _cp novo. __CURSOR__ marca onde o cursor começa; __CLASSNAME__ vira o nome do arquivo. Vazio = arquivo em branco."

[options.template_java_main]
type = "lines"
default = "public class __CLASSNAME__ {\n\n    public static void main(String[] args) {\n\n    }\n}\n"
label = "Java (classe comum)"
section = "Templates"
description = "Texto de todo arquivo .java novo. __CURSOR__ marca onde o cursor começa; __CLASSNAME__ vira o nome do arquivo. Vazio = arquivo em branco."

