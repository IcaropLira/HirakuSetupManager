schema = 1
id = "ripgrep"
name = "ripgrep"
description = "Busca rápida (o telescope do nvim usa o rg)"
platforms = ["linux", "macos", "windows"]
homepage = "https://github.com/BurntSushi/ripgrep"
discover = ["shell", "nvim"]

[[install]]
when = { os = "linux", arch = "x86_64" }
provides = ["rg"]
method = "release"
version = "16.0.0"
url = "https://github.com/BurntSushi/ripgrep/releases/download/{version}/ripgrep-{version}-x86_64-unknown-linux-musl.tar.gz"
sha256 = "54268ab4643c00a290a29b0086066d64b3f56236dd805ec64629a86f9bd29fd0"
dest = "~/.local/share/hiraku/ripgrep"
strip_components = 1
bins = [{ src = "rg", link = "~/.local/bin/rg" }]
bump = { github = "BurntSushi/ripgrep", tag_prefix = "" }

[[install]]
when = { os = "linux", arch = "aarch64" }
provides = ["rg"]
method = "release"
version = "16.0.0"
url = "https://github.com/BurntSushi/ripgrep/releases/download/{version}/ripgrep-{version}-aarch64-unknown-linux-gnu.tar.gz"
sha256 = "0b0bddcfaf42be1f3c56bf929d70defd1a2d96f2577aecbd7029a3734ddb4740"
dest = "~/.local/share/hiraku/ripgrep"
strip_components = 1
bins = [{ src = "rg", link = "~/.local/bin/rg" }]
bump = { github = "BurntSushi/ripgrep", tag_prefix = "" }

[[install]]
when = { os = "macos" }
method = "pkg"
names = { brew = "ripgrep" }
provides = ["rg"]

[[install]]
when = { os = "windows" }
method = "pkg"
names = { scoop = "ripgrep" }
