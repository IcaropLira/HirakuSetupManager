schema = 1
id = "ripgrep"
name = "ripgrep"
description = "Busca rápida (o telescope do nvim usa o rg)"
platforms = ["linux", "macos", "windows"]

[[install]]
when = { os = "linux", arch = "x86_64" }
provides = ["rg"]
method = "release"
version = "15.2.0"
url = "https://github.com/BurntSushi/ripgrep/releases/download/{version}/ripgrep-{version}-x86_64-unknown-linux-musl.tar.gz"
sha256 = "33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c"
dest = "~/.local/share/hiraku/ripgrep"
strip_components = 1
bins = [{ src = "rg", link = "~/.local/bin/rg" }]
bump = { github = "BurntSushi/ripgrep", tag_prefix = "" }

[[install]]
when = { os = "linux", arch = "aarch64" }
provides = ["rg"]
method = "release"
version = "15.2.0"
url = "https://github.com/BurntSushi/ripgrep/releases/download/{version}/ripgrep-{version}-aarch64-unknown-linux-gnu.tar.gz"
sha256 = "a740b91c82eaf9914cfedd353572f2791cbe0162c84101ee0951058f4dcbc90d"
dest = "~/.local/share/hiraku/ripgrep"
strip_components = 1
bins = [{ src = "rg", link = "~/.local/bin/rg" }]
bump = { github = "BurntSushi/ripgrep", tag_prefix = "" }

[[install]]
when = { os = "macos" }
method = "pkg"
names = { brew = "ripgrep" }
provides = ["rg"]

[[install]]
when = { os = "windows" }
method = "pkg"
names = { scoop = "ripgrep" }
