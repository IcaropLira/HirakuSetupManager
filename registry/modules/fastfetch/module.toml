schema = 1
id = "fastfetch"
name = "fastfetch"
description = "Resumo do sistema (visualizer do shell)"
platforms = ["linux", "macos", "windows"]

[[install]]
when = { os = "linux", arch = "x86_64" }
provides = ["fastfetch"]
method = "release"
version = "2.71.0"
url = "https://github.com/fastfetch-cli/fastfetch/releases/download/{version}/fastfetch-linux-amd64.tar.gz"
sha256 = "abf5c99a3702cce8d3c7fa2cccd3ac205076ae0f2e45bced24a42a68821702d6"
dest = "~/.local/share/hiraku/fastfetch"
strip_components = 1
bins = [{ src = "usr/bin/fastfetch", link = "~/.local/bin/fastfetch" }]
bump = { github = "fastfetch-cli/fastfetch", tag_prefix = "" }

[[install]]
when = { os = "linux", arch = "aarch64" }
provides = ["fastfetch"]
method = "release"
version = "2.71.0"
url = "https://github.com/fastfetch-cli/fastfetch/releases/download/{version}/fastfetch-linux-aarch64.tar.gz"
sha256 = "458248f2b3abab9c5e0a5b9df12cdcd1a966b355ddd5f3244a5eb47d17d33412"
dest = "~/.local/share/hiraku/fastfetch"
strip_components = 1
bins = [{ src = "usr/bin/fastfetch", link = "~/.local/bin/fastfetch" }]
bump = { github = "fastfetch-cli/fastfetch", tag_prefix = "" }

[[install]]
when = { os = "macos" }
method = "pkg"
names = { brew = "fastfetch" }
provides = ["fastfetch"]

[[install]]
when = { os = "windows" }
method = "pkg"
names = { scoop = "fastfetch" }
