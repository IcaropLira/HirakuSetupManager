schema = 1
id = "starship"
name = "starship"
description = "Prompt rápido e configurável"
platforms = ["linux", "macos", "windows"]
homepage = "https://starship.rs"
discover = ["shell", "kitty"]

[[install]]
when = { os = "linux", arch = "x86_64" }
provides = ["starship"]
method = "release"
version = "1.27.0"
url = "https://github.com/starship/starship/releases/download/v{version}/starship-x86_64-unknown-linux-musl.tar.gz"
sha256 = "10c8eb4cb3b761d9bf59ea828444c2dab36c900b7d69a69e08814b286969df89"
dest = "~/.local/share/hiraku/starship"
bins = [{ src = "starship", link = "~/.local/bin/starship" }]
bump = { github = "starship/starship" }

[[install]]
when = { os = "linux", arch = "aarch64" }
provides = ["starship"]
method = "release"
version = "1.27.0"
url = "https://github.com/starship/starship/releases/download/v{version}/starship-aarch64-unknown-linux-musl.tar.gz"
sha256 = "341f5cbf24699fa0b27ec88965ad25f862ea09e15d35a543fd6ffdff1d2aa00d"
dest = "~/.local/share/hiraku/starship"
bins = [{ src = "starship", link = "~/.local/bin/starship" }]
bump = { github = "starship/starship" }

[[install]]
when = { os = "macos" }
method = "pkg"
names = { brew = "starship" }
provides = ["starship"]

[[install]]
when = { os = "windows" }
method = "pkg"
names = { scoop = "starship" }

[[config]]
src = "files/starship.toml"
dest = { unix = "~/.config/starship.toml" }
