[package]
name = "hiraku-gui"
description = "Hiraku Setup Manager: app desktop (Tauri) que instala e depois vira o hub de configuração do setup"
version.workspace = true
edition.workspace = true
rust-version = "1.77"
license.workspace = true

[[bin]]
name = "hiraku-setup-manager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hiraku-core = { path = "../hiraku-core" }
hiraku-hub = { path = "../hiraku-hub" }
hiraku-cli = { path = "../hiraku-cli" }
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { workspace = true }
serde_json = "1"
