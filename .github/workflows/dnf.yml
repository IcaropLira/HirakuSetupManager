# Repositório DNF (Fedora/RHEL) no GitHub Pages: pega os .rpm de uma release,
# assina e regenera os metadados na branch gh-pages.
#
# Roda sozinho no fim de cada release (release.yml) ou à mão:
#   gh workflow run dnf.yml -f tag=v0.1.0
#
# Uma vez: Settings → Pages → Deploy from a branch → gh-pages / (root).
# Usuário:  sudo curl -fsSL -o /etc/yum.repos.d/hiraku.repo \
#             https://icaroplira.github.io/HirakuSetupManager/rpm/hiraku.repo
#           sudo dnf install hiraku-setup-manager
name: DNF

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      RPM_GPG_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: v0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: dnf-repo
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Ferramentas
        run: sudo apt-get update && sudo apt-get install -y createrepo-c rpm
      - name: Baixar os .rpm da release
        run: gh release download "$TAG" -p '*.rpm' -D incoming
      - name: Site atual (branch gh-pages)
        run: |
          if git fetch --depth 1 origin gh-pages:gh-pages 2>/dev/null; then
            git worktree add site gh-pages
          else
            git worktree add --orphan -b gh-pages site
          fi
      - name: Montar o repositório
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
        run: scripts/publish-dnf.sh incoming site
      - name: Publicar
        working-directory: site
        run: |
          git config user.name "hiraku-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nada mudou"; exit 0; fi
          git commit -m "dnf: $TAG"
          git push origin gh-pages
